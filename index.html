<!DOCTYPE html>
<html lang="uz">
<head><style>
body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:30px}
input{margin:10px}
img{max-width:350px;margin-top:15px;border:3px dashed #888;border-radius:8px;display:none;background:#f9f9f9}
</style></head>
<body><h3>📷 Rasm tanlang</h3>
<input type="file" accept="image/*" onchange="show(this)">
<img id="prev">
<script>function show(i){let f=i.files[0];if(f){let r=new FileReader();r.onload=e=>{let img=document.getElementById('prev');img.src=e.target.result;img.style.display='block'};r.readAsDataURL(f)}}</script>
</body></html>
